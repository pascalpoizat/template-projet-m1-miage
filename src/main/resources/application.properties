spring.application.name=projet-back

# Base de données par défaut : PostgreSQL lancé via `docker compose up -d`
spring.datasource.url=jdbc:postgresql://localhost:5432/projet
spring.datasource.username=projet
spring.datasource.password=projet

# Le schéma est géré UNIQUEMENT par Flyway (src/main/resources/db/migration).
# Hibernate se contente de vérifier que les entités correspondent au schéma.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Erreurs au format RFC 9457 (application/problem+json)
spring.mvc.problemdetails.enabled=true

# Swagger UI : http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info

# Origines autorisées à appeler l'API (front servi séparément)
app.cors.origines-autorisees=http://localhost:8000,http://127.0.0.1:8000
